name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          unzip -o StrengthSMPv1.zip -d build
          cd "$(dirname "$(find build -name pom.xml | head -1)")"
          mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: StrengthSMP
          path: build/**/target/*.jar
